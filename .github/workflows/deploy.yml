# =============================================================================
# OpsBridge365 - build, publish, deploy
# =============================================================================
# push to main (or manual dispatch)
#   -> secret-scan   gitleaks over the FULL git history; a finding fails the run
#   -> test          ruff + pytest, both hard gates
#   -> codeql        static analysis
#      (those three run in parallel and ALL gate everything below)
#   -> build-push    image to ghcr.io (free public registry, GITHUB_TOKEN only)
#   -> scan-image    Trivy + SBOM against the exact digest just published
#   -> deploy        az deployment group create against infra/main.bicep,
#                    authenticated with OIDC federation - no stored password
#
# Every gate is hard. A leaked credential, a failing test, a lint regression or
# a fixable CRITICAL/HIGH vulnerability all stop the pipeline before anything is
# published or shipped. The secret scan reads history rather than the diff,
# because a secret removed in a later commit is still a live secret.
#
# Third-party actions are pinned to full commit SHAs; the trailing comment is
# the human-readable version. A tag is a movable ref and would let whoever
# controls the action's repository change what runs in a job that holds
# `id-token: write`.
#
# TWO SEPARATE APP REGISTRATIONS, IN TWO SEPARATE TENANTS. Both halves of that
# sentence matter, and merging either one back together re-introduces a defect:
#
#   opsbridge-deploy  - deploys to Azure. OIDC federated credential, NO SECRET.
#                       Contributor on one resource group. No Graph perms, and
#                       NO Role Based Access Control Administrator - see below.
#                       Lives in the college tenant, which owns the subscription.
#   opsbridge-graph   - runtime Graph caller. HAS a client secret, which lives
#                       ONLY in Key Vault. Graph application permissions only,
#                       NO Azure RBAC at all. Lives in the Microsoft 365 tenant,
#                       which owns the SharePoint data and can grant app-only
#                       Graph consent.
#
# WHY THIS WORKFLOW NO LONGER CARRIES GRAPH_CLIENT_SECRET
# -------------------------------------------------------
# It used to pass the Graph client secret to Bicep on every deployment, so the
# credential sat in GitHub's secret store and was handed over on every push.
# infra/bootstrap.bicep now places it in Key Vault once, and infra/main.bicep
# only references it. The routine pipeline never sees the value.
#
# The same split removed the deployment identity's standing Role Based Access
# Control Administrator: the Key Vault role assignment that required it moved
# into bootstrap.bicep, which a human runs deliberately.
#
# ------- identity A: opsbridge-deploy - college tenant (OIDC, no secret) -----
# | Secret                 | What it is                                       |
# |------------------------|--------------------------------------------------|
# | AZURE_CLIENT_ID        | App (client) id of the DEPLOY app registration.  |
# |                        | Used by `azure/login` and NOWHERE ELSE in this   |
# |                        | file. This app has no client secret.             |
# | AZURE_TENANT_ID        | Directory (tenant) id of the tenant that owns    |
# |                        | the Azure subscription. `azure/login` ONLY -     |
# |                        | it is not the Graph tenant and must never be     |
# |                        | passed to Bicep. A tenant id is a public         |
# |                        | identifier, not a credential.                    |
# | AZURE_SUBSCRIPTION_ID  | Subscription the resource group lives in.        |
#
# ------- identity B: opsbridge-graph - M365 tenant (secret lives in KV) ------
# | Secret                 | What it is                                       |
# |------------------------|--------------------------------------------------|
# | GRAPH_TENANT_ID        | Directory (tenant) id of the Microsoft 365       |
# |                        | tenant holding the Graph app and the SharePoint  |
# |                        | site. Passed to Bicep as `graphTenantId`; the    |
# |                        | container builds its MSAL authority from it.     |
# |                        | A DIFFERENT tenant from AZURE_TENANT_ID.         |
# | GRAPH_CLIENT_ID        | App (client) id of the GRAPH app registration.   |
# |                        | Passed to Bicep as `clientId`. Never used to     |
# |                        | authenticate this workflow to Azure.             |
#
# ---------------- data locations (identifiers, not credentials) --------------
# | SHAREPOINT_SITE_ID     | Graph id of the SharePoint site.                 |
# | ASSETS_LIST_ID         | Graph id of the Assets list (written by sync).   |
# | TICKETS_LIST_ID        | Graph id of the Tickets list (read by /metrics). |
#
# -------------------------------- optional repository variables --------------
# | AZURE_RESOURCE_GROUP   | rg-opsbridge365      | Target resource group      |
# | AZURE_LOCATION         | westus2              | Region if the RG is new    |
# | NAME_PREFIX            | opsbridge            | Bicep namePrefix param     |
#
# Full setup (including the federated-credential subject and the one-time
# bootstrap) is in docs/DEPLOYMENT.md.
# =============================================================================

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, and every entry is load-bearing:
#   contents: read   - checkout
#   packages: write  - push to ghcr.io with GITHUB_TOKEN
#   id-token: write  - mint the OIDC token azure/login exchanges
permissions:
  contents: read
  packages: write
  id-token: write

# One deploy at a time. Not cancel-in-progress: killing a job midway through
# `az deployment group create` leaves the resource group half-updated.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ----------------------------------------------------------- secret scan --
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, not a shallow clone - see the note at the top.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ------------------------------------------------------------------ test --
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint (ruff)
        # A hard gate. A lint failure stops the image being published and stops
        # the deployment; it used to be `continue-on-error: true`.
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q

  # -------------------------------------------------------- static analysis --
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: python
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:python"

  # -------------------------------------------------------- build and push --
  build-and-push:
    name: build and push to ghcr.io
    # All three gates. Nothing is published to ghcr.io - and so nothing can be
    # deployed to Azure - unless the secret scan, the tests and CodeQL are clean.
    needs: [secret-scan, test, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      image-latest: ${{ steps.ref.outputs.image-latest }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image reference
        id: ref
        # GHCR rejects uppercase path segments; github.repository preserves the
        # owner's casing, so lowercase it rather than trusting the repo name.
        run: |
          name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}"                       >> "$GITHUB_OUTPUT"
          echo "image=${name}:${GITHUB_SHA}"        >> "$GITHUB_OUTPUT"
          echo "image-latest=${name}:latest"        >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        # The built-in GITHUB_TOKEN - no PAT to create, rotate or leak. And no
        # Azure Container Registry: a public GHCR package is free and Container
        # Apps pulls it with no registry credentials at all.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.ref.outputs.image-latest }}
            ${{ steps.ref.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo '- `${{ steps.ref.outputs.image-latest }}`'
            echo '- `${{ steps.ref.outputs.image }}`'
            echo '- digest `${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- scan image --
  scan-image:
    name: scan image (trivy + sbom)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy image scan
        # Policy: a CRITICAL or HIGH with a fix available fails the run and the
        # image is never deployed. Unfixable findings are reported and do not
        # block - failing on them only produces ignore files.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ needs.build-and-push.outputs.image }}
          format: spdx-json
          artifact-name: opsbridge365-sbom.spdx.json
          output-file: opsbridge365-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: opsbridge365-sbom.spdx.json
          retention-days: 90

  # ---------------------------------------------------------------- deploy --
  deploy:
    name: deploy to Azure
    needs: [build-and-push, scan-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure login (OIDC, passwordless)
        # AZURE_CLIENT_ID and AZURE_TENANT_ID are the *deploy* identity and its
        # home tenant - the one that owns the subscription - and this is the
        # only step in the file that uses either. The Graph runtime identity is
        # a different app registration in a different tenant; see
        # GRAPH_TENANT_ID / GRAPH_CLIENT_ID in the deploy step below.
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-opsbridge365' }}
          LOCATION: ${{ vars.AZURE_LOCATION || 'westus2' }}
        run: |
          set -euo pipefail
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --tags project=OpsBridge365 managedBy=github-actions \
            --only-show-errors -o none

      - name: Deploy infra/main.bicep
        id: infra
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-opsbridge365' }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX || 'opsbridge' }}
          CONTAINER_IMAGE: ${{ needs.build-and-push.outputs.image }}
          # These are the GRAPH runtime identity's public identifiers, not the
          # deploy identity, and not a credential: the client SECRET is not
          # here any more - bootstrap.bicep put it in Key Vault and main.bicep
          # only references it.
          #
          # GRAPH_TENANT_ID, not AZURE_TENANT_ID. The container turns this into
          # its MSAL authority (https://login.microsoftonline.com/<id>), so it
          # has to be the Microsoft 365 tenant where opsbridge-graph is
          # registered - not the tenant that owns the Azure subscription.
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          ASSETS_LIST_ID: ${{ secrets.ASSETS_LIST_ID }}
          TICKETS_LIST_ID: ${{ secrets.TICKETS_LIST_ID }}
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "opsbridge-${GITHUB_SHA::7}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              containerImage="$CONTAINER_IMAGE" \
              graphTenantId="$GRAPH_TENANT_ID" \
              clientId="$GRAPH_CLIENT_ID" \
              sharePointSiteId="$SHAREPOINT_SITE_ID" \
              assetsListId="$ASSETS_LIST_ID" \
              ticketsListId="$TICKETS_LIST_ID" \
            --only-show-errors \
            --query properties.outputs -o json)

          # Only non-secret outputs exist in the template (fqdn, names, ids).
          echo "api-fqdn=$(echo "$outputs" | jq -r '.apiFqdn.value')" >> "$GITHUB_OUTPUT"
          echo "job-name=$(echo "$outputs" | jq -r '.jobName.value')" >> "$GITHUB_OUTPUT"

      - name: Verify - GET /healthz returns 200
        env:
          FQDN: ${{ steps.infra.outputs.api-fqdn }}
        run: |
          set -euo pipefail
          url="https://${FQDN}/healthz"
          echo "Probing ${url}"
          # minReplicas is 0, so the first request after idle pays a cold start.
          # Retry for up to ~3 minutes, then fail: a deploy that cannot be
          # verified is a failed deploy.
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/healthz.json -w '%{http_code}' --max-time 30 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthz 200 on attempt ${attempt}"
              cat /tmp/healthz.json
              {
                echo "### Post-deploy verification"
                echo ""
                echo "- \`GET ${url}\` -> **200** (attempt ${attempt})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}, retrying in 10s"
            sleep 10
          done
          echo "::error::/healthz never returned 200 - failing the deploy"
          exit 1

      - name: Verify - /metrics refuses an unauthenticated caller
        env:
          FQDN: ${{ steps.infra.outputs.api-fqdn }}
        run: |
          set -euo pipefail
          url="https://${FQDN}/metrics"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
          echo "unauthenticated GET /metrics -> ${code}"
          # 401 is the pass. 503 would mean the token secret is missing from
          # Key Vault, which is also a refusal - but an unconfigured one, and
          # the operator needs to know. 200 is the regression this checks for.
          if [ "$code" != "401" ]; then
            echo "::error::/metrics returned ${code}; expected 401. A 200 means live tenant data is public again."
            exit 1
          fi
          echo "- \`GET ${url}\` (no token) -> **401**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify - public demo endpoint serves synthetic data
        env:
          FQDN: ${{ steps.infra.outputs.api-fqdn }}
        run: |
          set -euo pipefail
          url="https://${FQDN}/demo/metrics"
          body=$(curl -sS --max-time 30 "$url")
          echo "$body" | jq -e '.synthetic == true' > /dev/null
          echo "- \`GET ${url}\` -> **200**, \`synthetic: true\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify - sync job exists
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-opsbridge365' }}
          JOB_NAME: ${{ steps.infra.outputs.job-name }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors -o none
          trigger=$(az containerapp job show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$JOB_NAME" \
            --query properties.configuration.triggerType \
            --only-show-errors -o tsv)
          echo "job ${JOB_NAME} trigger type: ${trigger}"
          if [ "$trigger" != "Schedule" ]; then
            echo "::error::${JOB_NAME} is missing or is not schedule-triggered"
            exit 1
          fi
          echo "- \`az containerapp job show ${JOB_NAME}\` -> **Schedule**" >> "$GITHUB_STEP_SUMMARY"

      - name: Azure logout
        if: always()
        run: az logout --only-show-errors || true

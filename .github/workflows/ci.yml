# =============================================================================
# OpsBridge365 - pull request CI
# =============================================================================
# Secret scan, lint, test, static analysis and dependency review. No registry
# login, no cloud credentials, no deployment: a pull request from a fork must
# never be able to touch ghcr.io or Azure, and the way to guarantee that is to
# never grant the token more than read access.
#
# Every third-party action is pinned to a full commit SHA, not a tag. A tag is
# a movable ref: whoever can push a tag in the action's repository can change
# what runs here. The trailing comment is the human-readable version, and
# Dependabot updates both together.
#
# These job names are the required status checks on `main`. Renaming a job
# silently disables its branch-protection rule, so treat the names as an API.
# =============================================================================

name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ----------------------------------------------------------- secret scan --
  # Hard gate, not advisory. A finding fails the build; there is no
  # `continue-on-error` here on purpose. `deploy.yml` runs the same job and
  # makes the image build depend on it, so nothing reaches ghcr.io or Azure
  # without a clean scan.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # fetch-depth: 0 is the entire point. The default shallow clone only
          # has the tip commit, so a secret that was committed and then removed
          # in a later commit would scan clean - which is exactly the case that
          # matters, because the credential is still in the history and still
          # compromised.
          fetch-depth: 0

      # Run the gitleaks binary directly rather than gitleaks-action.
      #
      # This is a correctness fix, not a preference. gitleaks-action scans the
      # PUSH RANGE, not the repository. Run 32122134218 - the one this project
      # cited as proof of full-history scanning - logged:
      #
      #     git log -p -U0 -1
      #     1 commits scanned.
      #
      # One commit. `fetch-depth: 0` made the history available and nothing
      # used it, so the documented guarantee ("a secret removed in a later
      # commit is still a live secret, so scan history rather than the diff")
      # was not what actually ran. A force-push made it worse: the action tried
      # to diff from a commit that no longer existed and failed the job outright
      # having scanned ~0 bytes.
      #
      # `--log-opts="--all"` scans every commit reachable from every ref. The
      # binary is pinned by version AND verified by SHA-256 against the
      # checksum published with the release, so this step does not trade a
      # pinned action for an unpinned download.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan - every commit on every ref
        run: |
          set -euo pipefail
          echo "Scanning $(git rev-list --all --count) commits across all refs"
          gitleaks git . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1
          echo "- Secret scan: **clean** across \`$(git rev-list --all --count)\` commits" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif-${{ github.sha }}
          path: gitleaks.sarif
          retention-days: 30
          if-no-files-found: ignore

  # ------------------------------------------------------------ lint, test --
  test:
    name: lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        # From the lock, with hash verification, not from the pyproject floors.
        # `pip install .[dev]` would re-resolve every `>=` at CI time, so the
        # suite could pass against a dependency set no release ever ships.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint (ruff)
        # A hard gate. This step used to carry `continue-on-error: true`, which
        # meant a lint failure was reported and then ignored all the way through
        # to a production deployment.
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q

  # -------------------------------------------------------- static analysis --
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: python
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:python"

  # ----------------------------------------------------- dependency hygiene --
  trivy-fs:
    name: dependency scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Trivy filesystem scan
        # Vulnerability policy, stated once and enforced here and in deploy.yml:
        # a CRITICAL or HIGH finding that HAS A FIX AVAILABLE fails the build.
        # Unfixable findings are reported but do not block, because failing on
        # them only teaches people to add ignores.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  dependency-review:
    name: dependency review
    # Compares the PR's dependency graph against the base branch. Pull requests
    # only - there is no base to diff against on a push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

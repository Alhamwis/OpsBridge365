# =============================================================================
# OpsBridge365 - pull request CI
# =============================================================================
# Lint and test only. No registry login, no cloud credentials, no deployment:
# a pull request from a fork must never be able to touch ghcr.io or Azure, and
# the way to guarantee that is to never grant the token more than read access.
# =============================================================================

name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q
